<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Material Form</title>
<style>
/* ─── Print setup (CSS Paged Media) ─────────────────────────────────────────
   Page = US Letter, landscape. Margin 0 on the @page itself — each .sheet
   carries its own 0.4in white border. A zero page margin also stops the
   browser from printing its own URL/date headers and footers.          */
@page {
  size: 11in 8.5in;
  margin: 0;
}

:root {
  --ink: #111;
  --muted: #555;
  --rule: #9a9a9a;
  --rule-strong: #111;
  --fill: #f1f3f5;
  --accent: #1d3b6e;
  --screen-bg: #e6e8eb;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--screen-bg);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ─── Toolbar (screen only) ─────────────────────────────────────────────── */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  padding: 12px 20px;
  background: #fff;
  border-bottom: 1px solid #cfd3d8;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}
.toolbar-info { display: flex; flex-direction: column; font-size: 14px; }
.toolbar-info span { color: var(--muted); font-size: 12px; }
.print-btn {
  font: 700 16px Arial, Helvetica, sans-serif;
  padding: 12px 28px;
  border: 0;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.print-btn:disabled { opacity: 0.55; cursor: wait; }
.print-btn:not(:disabled):hover { filter: brightness(1.15); }
.toolbar-tip { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--muted); }

/* ─── Sheet: one physical page ─────────────────────────────────────────────
   Every height below comes from LAYOUT in lib/paginate.js via CSS variables. */
.sheet {
  width: var(--pageW);
  height: calc(var(--pageH) - 0.02in); /* hair under 8.5in so Chrome never adds a blank page */
  padding: var(--margin);
  margin: 24px auto;
  background: #fff;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  break-after: page;
  page-break-after: always;
}
.sheet > * { flex: none; }
.sheet > * + * { margin-top: var(--gap); }
.sheet > .spacer { flex: 1 1 auto; margin: 0; }
.sheet > .page-footer { margin-top: 0; }

/* Header — repeated on every sheet */
.sheet-header {
  height: var(--header);
  display: grid;
  grid-template-columns: 2.6in 1fr 2.6in;
  align-items: center;
  border-bottom: 2px solid var(--rule-strong);
}
.brand img { max-height: 0.62in; max-width: 2.5in; display: block; }
.wordmark {
  display: inline-block;
  font-weight: 800;
  font-size: 13pt;
  line-height: 1.1;
  letter-spacing: 0.02em;
  color: var(--accent);
  text-transform: uppercase;
}
.title { text-align: center; }
.title h1 { margin: 0; font-size: 17pt; white-space: nowrap; letter-spacing: 0.04em; }
.title h1 .cont { font-size: 11pt; font-weight: 600; letter-spacing: 0; }
.title p { margin: 3px 0 0; font-size: 9pt; color: var(--muted); }

/* Page-1 info band */
.info {
  height: var(--info);
  display: grid;
  border: 1px solid var(--rule-strong);
}
.field { padding: 5px 8px; border-left: 1px solid var(--rule); overflow: hidden; }
.field:first-child { border-left: 0; }
.field .label { font-size: 7pt; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.field .value { margin-top: 4px; font-size: 11pt; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Page-1 bay list */
.bays {
  height: var(--baysH);
  border: 1px solid var(--rule-strong);
  padding: 0 8px calc(var(--baysPad) / 2);
  overflow: hidden;
}
.bays-label {
  height: var(--baysHead);
  line-height: var(--baysHead);
  font-size: 7pt;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.bays-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 16px;
}
.bays-list li {
  height: var(--bayLine);
  line-height: var(--bayLine);
  font-size: 9pt;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bays-list li::before { content: '▪ '; color: var(--accent); }

/* Line items */
.items { width: 100%; border-collapse: collapse; table-layout: fixed; }
.items thead tr { height: var(--thead); }
.items th {
  font-size: 7.5pt;
  letter-spacing: 0.05em;
  text-align: left;
  padding: 0 6px;
  background: var(--fill);
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1.5px solid var(--rule-strong);
}
.items td {
  font-size: 9.5pt;
  line-height: 0.16in;
  padding: 0 6px;
  border-bottom: 1px solid var(--rule);
  vertical-align: middle;
  overflow: hidden;
}
.items th:nth-child(1), .items td.no { text-align: right; color: var(--muted); }
.items td.no { font-size: 8pt; }
.items th.center, .items td.center { text-align: center; }
.items td.dmg { font-weight: 700; color: #a11; }
.items td.cond.bad { font-weight: 700; color: #a11; }
.items td.qty { font-weight: 700; font-size: 10.5pt; }
.items td.part { font-family: 'Consolas', 'Courier New', monospace; font-size: 9.5pt; }
.clamp {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  word-break: break-word;
}
.empty { font-size: 10pt; color: var(--muted); font-style: italic; }

/* Signature block — last sheet only, pushed to the bottom by .spacer */
.signatures { height: var(--sig); padding-top: 0.18in; }
.sig-row { display: flex; gap: 0.5in; height: 0.52in; }
.sig-line {
  flex: 1;
  border-bottom: 1.5px solid var(--rule-strong);
  position: relative;
}
.sig-line.date { flex: 0 0 2.2in; }
.sig-line span {
  position: absolute;
  left: 0;
  bottom: -0.17in;
  font-size: 7pt;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.note { margin: 0.2in 0 0; font-size: 7.5pt; font-style: italic; color: var(--muted); }

/* Footer — every sheet */
.page-footer {
  height: var(--footer);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  font-size: 7.5pt;
  color: var(--muted);
}

/* Error / home pages */
.message, .home { max-width: 640px; margin: 80px auto; padding: 32px; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
.message h1, .home h1 { margin-top: 0; font-size: 22px; }
.home code { background: var(--fill); padding: 2px 5px; border-radius: 3px; }

/* ─── Print ─────────────────────────────────────────────────────────────── */
@media print {
  html, body { background: #fff; }
  .toolbar { display: none !important; }
  .sheet { margin: 0; box-shadow: none; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
}

/* Small screens: let the sheets scroll sideways instead of squashing */
@media screen and (max-width: 11.5in) {
  .bol { overflow-x: auto; padding: 0 8px; }
}

</style>
</head>
<body>
<div id="app"><main class="message"><h1>Loading…</h1><p>Getting the record from Airtable.</p></main></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  ONE print page for every site and every form type.
//  The "BOL Link" field in each Airtable base opens:
//    print.html?type=pull|receipt|order&site=…&groups=…&base=app…&t=tbl…&lt=tbl…&id=rec…
//  Everything site-specific is in that link; nothing here needs editing for a new site.
//  Edit wording or layout below on GitHub (pencil icon → Commit changes) — every site gets it.
// ─────────────────────────────────────────────────────────────────────────────
const SETTINGS = {
  functionUrl: 'https://vbfspyruvaoqmhuutphl.supabase.co/functions/v1/bol-print',
  companyName: 'AIME Automation Installation',
  logo: null, // e.g. 'logo.png' after uploading it to this repo; null = company name as text
  fillBlankRows: true, // blank lines on the last page for hand-written additions
};

// Column widths are in inches; one column per form has width null and takes the rest.
// chars = characters that fit on one line per inch (for row-height estimates).
const FORMS = {
  pull: {
    docName: 'Field Material Request',
    title: 'FIELD MATERIAL REQUEST FORM',
    subtitle: (site) => `Field Material Delivery${site ? ` — ${site}` : ''}`,
    info: [['Request #', 'Number'], ['Requested By', 'Requested By'], ['Date Needed', 'Date Needed'], ['Delivery Location', 'Location'], ['Printed', '@printed']],
    infoCols: '1.3fr 1.4fr 1fr 2.4fr 1fr',
    groupsLabel: 'Work Packages',
    columns: [
      { label: 'QTY REQUESTED', key: 'Qty', width: 1.05, cls: 'qty center' },
      { label: 'PART #', key: 'Part #', width: 2.35, cls: 'part', mono: true },
      { label: 'DESCRIPTION', key: 'Description', width: null, cls: 'desc' },
    ],
    signatures: [['SIGNATURE OF MATERIAL HANDLER (DELIVERED BY)', 'DELIVERY DATE'], ['SIGNATURE OF INSTALL CONTRACTOR / RECEIVER', 'DATE RECEIVED']],
    note: '*NOTE: Signature of Receiver acknowledges all material received is not in overage, short, or damaged status. ' +
      'If there is an issue with the material, add notes on this form.',
    empty: 'No line items on this request.',
  },
  receipt: {
    docName: 'Truck Receipt',
    title: 'TRUCK RECEIVING REPORT',
    subtitle: (site) => `Material Received${site ? ` — ${site}` : ''}`,
    info: [['Receipt #', 'Number'], ['Date Received', 'Date Received'], ['Carrier / Truck', 'Carrier'], ['BOL / Packing Slip #', 'Paperwork'], ['Received By', 'Received By'], ['Printed', '@printed']],
    infoCols: '0.9fr 1.1fr 1.7fr 1.7fr 1.3fr 1fr',
    groupsLabel: 'Cells',
    groupsSuffix: ' ON THIS TRUCK',
    columns: [
      { label: 'QTY RCVD', key: 'Qty', width: 0.8, cls: 'qty center' },
      { label: 'DMG / REJ', key: 'Damaged', width: 0.75, cls: 'dmg center' },
      { label: 'PART #', key: 'Part #', width: 1.6, cls: 'part', mono: true },
      { label: 'DESCRIPTION', key: 'Description', width: null, cls: 'desc' },
      { label: 'CONDITION', key: 'Condition', width: 1.0, cls: 'cond', flag: (v) => v && v !== 'Good' },
      { label: 'YARD LOCATION', key: 'Yard', width: 1.45, cls: 'yard' },
    ],
    signatures: [['DRIVER / CARRIER SIGNATURE', 'DATE'], ['RECEIVED BY (SIGNATURE)', 'DATE RECEIVED']],
    note: '*NOTE: Quantities are good material counted at unloading. Damaged or rejected material is listed separately and ' +
      'must also be noted on the carrier\'s bill of lading before the driver leaves.',
    empty: 'No receiving lines on this truck yet.',
  },
  order: {
    docName: 'Supplier Order',
    title: 'SUPPLIER MATERIAL ORDER',
    subtitle: (site) => `Material Order by CWP Phase${site ? ` — ${site}` : ''}`,
    info: [['Order #', 'Number'], ['Supplier', 'Supplier'], ['Supplier PO / Ref #', 'PO'], ['Ordered By', 'Ordered By'], ['Date Needed', 'Date Needed'], ['Printed', '@printed']],
    infoCols: '0.8fr 1.9fr 1.4fr 1.3fr 1fr 1fr',
    groupsLabel: 'CWP Phase',
    noCount: true,
    columns: [
      { label: 'QTY TO ORDER', key: 'Qty', width: 1.05, cls: 'qty center' },
      { label: 'PART #', key: 'Part #', width: 2.35, cls: 'part', mono: true },
      { label: 'DESCRIPTION', key: 'Description', width: null, cls: 'desc' },
    ],
    signatures: [['ORDERED BY (SIGNATURE)', 'DATE'], ['APPROVED BY (SIGNATURE)', 'DATE']],
    note: '',
    empty: 'No line items on this order. Check Build Order Lines in Airtable first.',
  },
};

// ─────────────────────────────────────────────────────────────────────────────
//  PAGE MATH — browsers can repeat a header, but none can "put this block at the
//  bottom of the LAST printed page". So each page is an exact 11in × 8.5in sheet,
//  every block has a fixed height from LAYOUT (also pushed into the CSS), and the
//  signature block sits on the final sheet only. Nothing can spill onto an extra page.
// ─────────────────────────────────────────────────────────────────────────────
const LAYOUT = {
  pageW: 11, pageH: 8.5, margin: 0.4,
  usable: 7.6,        // height inside the margins (kept slightly under 7.7 for safety)
  header: 0.85,       // title band — every page
  info: 0.62,         // info band — page 1
  baysHead: 0.26, bayLine: 0.2, baysPad: 0.1, // group list — page 1
  thead: 0.3,         // column titles — every page
  row: 0.27, rowExtraLine: 0.16,
  footer: 0.28,       // Page X of Y — every page
  sig: 1.55,          // signature block — last page
  gap: 0.1,
};
const TABLE_W = 10.2, NO_W = 0.45, TEXT_CPI = 12.4, MONO_CPI = 11, BAYS_PER_LINE = 2, MAX_LINES = 3;

function sizeColumns(form) {
  const fixed = form.columns.reduce((s, c) => s + (c.width || 0), NO_W);
  form.columns.forEach((c) => {
    c.w = c.width || Math.max(1, TABLE_W - fixed);
    c.chars = Math.max(4, Math.floor((c.w - 0.12) * (c.mono ? MONO_CPI : TEXT_CPI)));
  });
}

function rowLines(form, line) {
  let n = 1;
  for (const c of form.columns) n = Math.max(n, Math.ceil(String(line[c.key] ?? '').length / c.chars) || 1);
  return Math.min(n, MAX_LINES);
}

function paginate(form, lines, bayCount) {
  const L = LAYOUT;
  const items = lines.map((line, i) => ({ ...line, lineNo: i + 1, h: L.row + (rowLines(form, line) - 1) * L.rowExtraLine }));
  const baysH = L.baysHead + Math.max(1, Math.ceil(bayCount / BAYS_PER_LINE)) * L.bayLine + L.baysPad;
  const everyPage = L.header + L.thead + L.footer + L.gap * 2;
  const firstExtra = L.info + baysH + L.gap * 2;
  const sigSpace = L.sig + L.gap;
  const pages = [];
  let i = 0;
  while (pages.length < 500) {
    const first = pages.length === 0;
    const avail = L.usable - everyPage - (first ? firstExtra : 0);
    const remaining = items.slice(i);
    const remainingH = remaining.reduce((s, it) => s + it.h, 0);
    if (remainingH + sigSpace <= avail) { // everything left fits WITH the signatures
      const blank = SETTINGS.fillBlankRows ? Math.max(0, Math.floor((avail - sigSpace - remainingH) / L.row)) : 0;
      pages.push({ first, last: true, items: remaining, blankRows: blank });
      break;
    }
    const pageItems = [];
    let used = 0;
    while (i < items.length && used + items[i].h <= avail) { used += items[i].h; pageItems.push(items[i]); i++; }
    // Rows fit but the signatures didn't: hold one back so the last page carries items + signatures.
    if (i === items.length && pageItems.length > 1) { i--; pageItems.pop(); }
    if (pageItems.length === 0 && i < items.length) { pageItems.push(items[i]); i++; }
    pages.push({ first, last: false, items: pageItems, blankRows: 0 });
  }
  return { pages, baysH };
}

// ─────────────────────────────────────────────────────────────────────────────
//  RENDERING
// ─────────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $app = document.getElementById('app');

function showMessage(title, text) {
  $app.innerHTML = `<main class="message"><h1>${esc(title)}</h1><p>${esc(text)}</p></main>`;
}

function render(form, data, opts) {
  sizeColumns(form);
  const head = data.head || {};
  const lines = data.lines || [];
  const band = [...(data.groups || [])];
  if (head.Notes) band.push(`Notes: ${String(head.Notes).replace(/\s+/g, ' ')}`);
  const { pages, baysH } = paginate(form, lines, band.length);
  const root = document.documentElement.style;
  Object.entries(LAYOUT).forEach(([k, v]) => root.setProperty(`--${k}`, `${v}in`));
  root.setProperty('--baysH', `${baysH}in`);

  const number = head.Number || '';
  const docTitle = `${form.docName} #${number}`;
  document.title = docTitle;
  const printed = new Date().toLocaleDateString('en-US', { timeZone: opts.timeZone });
  const n = lines.length;
  const plural = (c, w) => `${c} ${w}${c === 1 ? '' : 's'}`;
  const groupsLabel = (opts.groupsLabel || form.groupsLabel).toUpperCase() + (form.groupsSuffix || '');
  const groupCount = (data.groups || []).length;

  const brand = SETTINGS.logo
    ? `<img src="${esc(SETTINGS.logo)}" alt="${esc(SETTINGS.companyName)}">`
    : `<span class="wordmark">${esc(SETTINGS.companyName)}</span>`;
  const header = (continued) => `<header class="sheet-header"><div class="brand">${brand}</div>
    <div class="title"><h1>${esc(form.title)}${continued ? '<span class="cont"> (continued)</span>' : ''}</h1>
    <p>${esc(form.subtitle(opts.site))}</p></div><div></div></header>`;
  const field = (label, value) =>
    `<div class="field"><div class="label">${esc(label)}</div><div class="value">${esc(value) || '&nbsp;'}</div></div>`;
  const signatures = `
    <div class="signatures">
      ${form.signatures.map(([who, when]) => `<div class="sig-row"><div class="sig-line"><span>${esc(who)}</span></div><div class="sig-line date"><span>${esc(when)}</span></div></div>`).join('')}
      ${form.note ? `<p class="note">${esc(form.note)}</p>` : ''}
    </div>`;
  const cols = `<colgroup><col style="width:${NO_W}in">${form.columns.map((c) => `<col style="width:${c.width ? `${c.width}in` : 'auto'}">`).join('')}</colgroup>`;
  const thead = `<thead><tr><th>#</th>${form.columns.map((c) => `<th class="${c.cls.includes('center') ? 'center' : ''}">${esc(c.label)}</th>`).join('')}</tr></thead>`;
  const cell = (c, v) => {
    const cls = c.cls + (c.flag && c.flag(v) ? ' bad' : '');
    const inner = c.cls.startsWith('qty') || c.cls.startsWith('dmg') || c.cls.startsWith('cond') ? esc(v) : `<div class="clamp">${esc(v)}</div>`;
    return `<td class="${cls}">${inner}</td>`;
  };
  const blankRow = `<tr class="blank" style="height:${LAYOUT.row}in"><td></td>${'<td></td>'.repeat(form.columns.length)}</tr>`;

  const sheets = pages.map((page, idx) => `
    <section class="sheet">
      ${header(!page.first)}
      ${page.first ? `
        <div class="info" style="grid-template-columns:${form.infoCols}">
          ${form.info.map(([label, k]) => field(label, k === '@printed' ? printed : head[k])).join('')}
        </div>
        <div class="bays"><div class="bays-label">${esc(groupsLabel)}${form.noCount ? '' : ` (${groupCount})`}</div>
          <ul class="bays-list">${band.length ? band.map((b) => `<li title="${esc(b)}">${esc(b)}</li>`).join('') : '<li>—</li>'}</ul>
        </div>` : ''}
      <table class="items">
        ${cols}${thead}
        <tbody>
          ${page.items.map((it) => `<tr style="height:${it.h}in"><td class="no">${it.lineNo}</td>${form.columns.map((c) => cell(c, it[c.key])).join('')}</tr>`).join('')}
          ${blankRow.repeat(page.blankRows)}
        </tbody>
      </table>
      ${page.last && n === 0 ? `<p class="empty">${esc(form.empty)}</p>` : ''}
      <div class="spacer"></div>
      ${page.last ? signatures : ''}
      <footer class="page-footer"><span>${esc(SETTINGS.companyName)} · ${esc(docTitle)}</span>
        <span>${plural(n, 'line item')} · Page ${idx + 1} of ${pages.length}</span></footer>
    </section>`).join('');

  $app.innerHTML = `
    <div class="toolbar">
      <div class="toolbar-info"><strong>${esc(docTitle)}</strong><span>${plural(n, 'line item')} · ${plural(pages.length, 'page')}</span></div>
      <button type="button" class="print-btn" disabled>Loading…</button>
      <p class="toolbar-tip">In the print dialog: Layout <b>Landscape</b>, Paper <b>Letter</b>, Margins <b>Default</b>, Scale <b>100</b>. Choose “Save as PDF” as the printer to get a PDF.</p>
    </div>
    <div class="bol">${sheets}</div>`;

  const btn = $app.querySelector('.print-btn');
  btn.onclick = () => window.print();
  const imgs = [...document.images].filter((im) => !im.complete);
  Promise.all([document.fonts?.ready, ...imgs.map((im) => new Promise((r) => { im.onload = im.onerror = r; }))])
    .then(() => {
      btn.disabled = false;
      btn.textContent = 'Print / Save to PDF';
      if (opts.autoPrint) setTimeout(() => window.print(), 300);
    });
}

// ─────────────────────────────────────────────────────────────────────────────
//  DEMO DATA  (?type=receipt&id=demo, add &lines=120 to test long lists)
// ─────────────────────────────────────────────────────────────────────────────
function demo(type, count) {
  const parts = [
    ['461-00106', 'AIB 220 · CIS side one 461-00106-06.01 REV A'], ['480-01726', 'AIB 220 · Kit 480-01726 · SHIPPING AND INSTALLATION KIT FOR 461-00001-01.01'],
    ['151-00111', 'Cross-Aisle Tie_Connection at Posts'], ['185-00232-03', 'GRATING, PRODUCT AISLE 4000MM X 614MM X 25MM (GREEN)'],
  ];
  const conds = ['Good', 'Good', 'Damaged', 'Good', 'Wrong part'];
  return {
    head: { Number: 'DEMO', 'Requested By': 'Steve', 'Date Needed': '10/16/2026', Location: 'AIB 220', 'Date Received': '10/14/2026',
      Carrier: 'UPS Freight #4471', Paperwork: 'PS-102938', 'Received By': 'Steve', Supplier: 'Supplier name', PO: 'PO-1234', 'Ordered By': 'Steve', Notes: '' },
    groups: type === 'order' ? ['Phase 3 (24 bays)'] : ['AIB 220 · Mechanical · Install Depal Conv, Spreader, CIS', 'AIB 220 · Mechanical · Install PDU, Lift'],
    lines: Array.from({ length: count }, (_, i) => ({
      Qty: String(((i * 7) % 24) + 1), 'Part #': parts[i % 4][0], Description: parts[i % 4][1],
      Damaged: conds[i % 5] === 'Damaged' ? '1' : '', Condition: conds[i % 5], Yard: `Yard Row ${'ABCD'[i % 4]} / Pallet ${i + 1}`,
    })),
  };
}

// ─────────────────────────────────────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────────────────────────────────────
(async function main() {
  const q = new URLSearchParams(location.search);
  const p = (k) => (q.get(k) || '').trim();
  const type = p('type').toLowerCase() || 'pull';
  const form = FORMS[type];
  const opts = { site: p('site'), groupsLabel: p('groups'), timeZone: p('tz') || undefined, autoPrint: p('print') === '1' };

  if (!form) return showMessage('Unknown form', `This link asks for "${type}". It should be type=pull, type=receipt or type=order.`);
  if (!p('id')) {
    return showMessage('Printable material forms', 'Open a form from a "Print BOL" button in Airtable. To preview a layout with sample data, add ?type=pull&id=demo (or receipt / order) to this address.');
  }
  if (p('id') === 'demo') return render(form, demo(type, Math.min(Number(p('lines')) || 40, 400)), opts);

  try {
    const params = new URLSearchParams({ type, base: p('base'), t: p('t'), lt: p('lt'), id: p('id') });
    const res = await fetch(`${SETTINGS.functionUrl}?${params}`, { cache: 'no-store' });
    const data = await res.json().catch(() => ({ error: `Unexpected response (${res.status}) from the Supabase function.` }));
    if (!res.ok || data.error) {
      if (res.status === 401) return showMessage('Supabase function is locked', 'In Supabase, open Edge Functions → bol-print → Details and turn OFF "Verify JWT", then save.');
      const title = { 404: 'Record not found', 403: 'Access denied', 400: 'Invalid link', 409: 'Base not set up for printing' }[res.status] || 'Could not load from Airtable';
      return showMessage(title, data.error || data.message || data.msg || `Error ${res.status}`);
    }
    render(form, data, opts);
  } catch (err) {
    showMessage('Could not reach the form service', `${err.message}. Check your internet connection, then reload.`);
  }
})();

</script>
